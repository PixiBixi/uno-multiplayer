version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A hijacked npm package is usually spotted and yanked within days, so nothing
    # here is picked up on the day it ships. Security updates ignore the cooldown.
    cooldown:
      default-days: 5
    # One PR per group keeps the review load sane on a small project.
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
    # typescript-eslint peers on typescript <6.1.0, so TypeScript 7 fails `npm ci`
    # outright and takes the whole dev group down with it: every other bump in the
    # group is held hostage. Drop this the day typescript-eslint accepts 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # Actions are pinned by commit SHA, so what Dependabot bumps here is the digest
  # behind a tag; the version comment on the same line is what it keeps readable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5

  # Nothing watched the base image, which is how it sat on Node 22 unnoticed while the
  # rest of the repo moved to 24. Monthly: a base image moves on the runtime's schedule,
  # not on a library's, and the CI step in the quality job fails the PR if a bump here
  # ever lands without .nvmrc following it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
