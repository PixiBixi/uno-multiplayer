name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      # The image once shipped Node 22 while every other job validated the 24 in .nvmrc:
      # supported, but not the runtime anything was tested on, and nothing failed to say
      # so. This is the only place the two can be compared, so it is asserted here.
      - name: The image runs the Node version CI validates
        run: |
          PINNED=$(tr -d '[:space:]' < .nvmrc)
          STAGES=$(grep -c '^FROM node:' Dockerfile)
          MATCHING=$(grep -c "^FROM node:${PINNED}-alpine" Dockerfile)
          if [ "$STAGES" -ne "$MATCHING" ]; then
            echo "::error::.nvmrc pins Node ${PINNED}, the Dockerfile disagrees:"
            grep -n '^FROM node:' Dockerfile
            exit 1
          fi
          echo "All ${STAGES} Dockerfile stages track Node ${PINNED}."

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor declared in engines, current Active LTS, and current release.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Gated on the suites so a red build can never move the published tag: a
    # `docker compose pull` would otherwise fetch an image whose tests failed.
    # The cost is that a Dockerfile break is reported after the tests rather than
    # beside them, which is the right trade — the image is the last thing anybody
    # needs feedback on.
    needs: [quality, test, e2e]
    permissions:
      # Only this job writes, and only to the package registry. The workflow
      # default stays contents: read.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t uno-multiplayer:ci .
      # Building proves nothing on its own: boot it and probe what it serves.
      - name: Boot the image and probe it
        run: |
          docker run --rm -d --name uno-ci -p 5099:5050 uno-multiplayer:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:5099/healthz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:5099/healthz
          curl -sf http://127.0.0.1:5099/ | grep -q 'id="root"'
          curl -sf 'http://127.0.0.1:5099/socket.io/?EIO=4&transport=polling' >/dev/null
          test "$(docker exec uno-ci id -u)" != "0"
          docker stop uno-ci

      # Only from main, and never from a pull request — a fork must not be able to
      # publish, and neither should a branch nobody has merged.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Retagged, never rebuilt. What gets published is byte-identical to the image
      # that was just booted and probed above; a second build would publish
      # something nothing had proved runs.
      #
      # Two tags: `latest` for `docker compose pull`, and the commit SHA so a
      # rollback is `docker run ...@sha` rather than an archaeology exercise.
      - name: Publish to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/uno-multiplayer"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')   # GHCR rejects capitals
          docker tag uno-multiplayer:ci "$IMAGE:latest"
          docker tag uno-multiplayer:ci "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "published $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
