name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      # The image once shipped Node 22 while every other job validated the version in .nvmrc:
      # supported, but not the runtime anything was tested on, and nothing failed to say
      # so. This is the only place the two can be compared, so it is asserted here.
      - name: The image runs the Node version CI validates
        run: |
          PINNED=$(tr -d '[:space:]' < .nvmrc)
          STAGES=$(grep -c '^FROM node:' Dockerfile)
          MATCHING=$(grep -c "^FROM node:${PINNED}-alpine" Dockerfile)
          if [ "$STAGES" -ne "$MATCHING" ]; then
            echo "::error::.nvmrc pins Node ${PINNED}, the Dockerfile disagrees:"
            grep -n '^FROM node:' Dockerfile
            exit 1
          fi
          echo "All ${STAGES} Dockerfile stages track Node ${PINNED}."

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Floor declared in engines, the Active LTS, and the release .nvmrc pins.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    # Gated on the suites so a red build can never move the published tag: a
    # `docker compose pull` would otherwise fetch an image whose tests failed.
    # The cost is that a Dockerfile break is reported after the tests rather than
    # beside them, which is the right trade - the image is the last thing anybody
    # needs feedback on.
    needs: [quality, test, e2e]
    permissions:
      # Only this job writes, and only to the package registry. The workflow
      # default stays contents: read.
      contents: read
      packages: write
      id-token: write # keyless identity used to sign the provenance attestation
      attestations: write # store the attestation on the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t uno-multiplayer:ci .
      # Building proves nothing on its own: boot it and probe what it serves.
      - name: Boot the image and probe it
        run: |
          docker run --rm -d --name uno-ci -p 5099:5050 uno-multiplayer:ci
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:5099/healthz >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:5099/healthz
          curl -sf http://127.0.0.1:5099/ | grep -q 'id="root"'
          curl -sf 'http://127.0.0.1:5099/socket.io/?EIO=4&transport=polling' >/dev/null
          test "$(docker exec uno-ci id -u)" != "0"
          docker stop uno-ci

      # Only from main, and never from a pull request - a fork must not be able to
      # publish, and neither should a branch nobody has merged.
      # Every ${{ }} below goes through env: first. The expression is substituted
      # before bash parses the line, so a value carrying `;` or `$(...)` would run
      # as a command; as a variable it stays a string whatever it holds.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Retagged, never rebuilt. What gets published is byte-identical to the image
      # that was just booted and probed above; a second build would publish
      # something nothing had proved runs.
      #
      # Two tags: `latest` for `docker compose pull`, and the commit SHA so a
      # rollback is `docker run ...@sha` rather than an archaeology exercise.
      - name: Publish to GHCR
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${OWNER}/uno-multiplayer"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')   # GHCR rejects capitals
          docker tag uno-multiplayer:ci "$IMAGE:latest"
          docker tag uno-multiplayer:ci "$IMAGE:${SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${SHA}"
          # Read back rather than computed: this is the digest the registry
          # actually stored, and it is what the attestation below is bound to.
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${SHA}" | cut -d@ -f2)
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "published $IMAGE:${SHA} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"

      # `latest` is what `docker compose pull` fetches, so it is the tag that most
      # needs to say where it came from -- the semver image in release.yml is the
      # one nobody pulls by accident.
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
