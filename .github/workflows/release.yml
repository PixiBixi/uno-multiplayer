name: Release

on:
  push:
    branches: [main]
  # Re-tag an image for a release that already exists. Needed the first time a
  # version is seeded by hand — cog finds nothing to bump, so the push path never
  # reaches the image job — and useful whenever a publish failed and wants a retry
  # without inventing a commit to carry it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish the image for, e.g. v1.0.0
        required: true
        type: string

# Nothing is granted workflow-wide: each job opts into exactly what it writes.
permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # cog pushes the bump commit and its tag, gh cuts the release
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
    steps:
      # The credential is kept on purpose: cog bumps, commits and pushes the tag
      # from this clone, so dropping it would leave nothing able to push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # cog needs the whole history to work out what changed since the tag.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          git-user: github-actions[bot]
          git-user-email: github-actions[bot]@users.noreply.github.com
          # v4 replaced the check/check-latest-tag-only inputs with command/args,
          # and a missing `command` fails the job silently.
          command: check
          args: --from-latest-tag

      # `cog bump` is a no-op when nothing since the tag warrants one — a release
      # of only docs or tests, say — so its exit code cannot be the signal.
      # Comparing the described tag before and after can.
      - name: Bump version
        id: bump
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          cog bump --auto || true
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ "$BEFORE" != "$AFTER" ]; then
            git push
            git push origin "$AFTER"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          TAG="$TAG_NAME"
          # The section cog just wrote, between this version's heading and the next
          # separator, so the release notes are the changelog rather than a rewrite.
          NOTES=$(awk "/^## .*${TAG#v}/{found=1; next} found && /^- - -/{exit} found{print}" CHANGELOG.md)
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "${NOTES:-Release $TAG}" \
            --verify-tag

  # Semver tags only. `latest` and the full commit sha belong to ci.yml's Docker job,
  # which publishes on every green push — so a fix that has not been released is
  # still deployable. Splitting ownership this way keeps two workflows from racing
  # each other over the same tag.
  tag-release-image:
    needs: release
    # Either a bump just happened, or somebody asked for a specific existing tag.
    # `always()` is required because the release job is skipped entirely on a
    # manual run, and a skipped dependency would otherwise skip this too.
    if: |
      always() && (
        needs.release.outputs.bumped == 'true' ||
        inputs.tag != ''
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless identity used to sign the provenance attestation
      attestations: write # store the attestation on the repo
    steps:
      # Through env: rather than inline. `inputs.tag` is free text typed into the
      # dispatch form, and an inline ${{ }} would be substituted before bash parses
      # the line, turning `$(...)` in that field into a command.
      - name: Resolve which tag to publish
        id: which
        env:
          REQUESTED_TAG: ${{ inputs.tag || needs.release.outputs.tag_name }}
        run: echo "tag=${REQUESTED_TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.which.outputs.tag }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.which.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.which.outputs.tag }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Records how the image was built (repo, workflow, commit) and pushes the
      # signed attestation next to the manifest, so anyone can run
      # `gh attestation verify oci://... --repo` without trusting the tag.
      # metadata-action lowercases the image on its own, the attestation does not,
      # and GHCR rejects capitals -- so the owner is folded down here too.
      - name: Lowercase the image name
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: echo "name=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
