<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- SVG for the tab, a 32px PNG for browsers without SVG icons; iOS ignores both
         and wants the 180px touch icon, drawn full bleed because iOS masks the corners. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Two values, one per scheme: a single theme-color tints the browser chrome wrongly
         in the other. Both are the app's own --bone / dark --bone from tokens.css. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f1e8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16130f" />
    <title>UNO Multiplayer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
