<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UNO">
  <!-- Two fanned cards: a red card behind, the four-colour wild in front. Big flat shapes
       only, because a favicon is judged at 16px. Pigments from apps/web/src/lib/palette.ts. -->
  <defs>
    <radialGradient id="table" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#4a3528"/>
      <stop offset="1" stop-color="#14100e"/>
    </radialGradient>
    <clipPath id="oval">
      <ellipse cx="38.5" cy="33" rx="7.6" ry="12" transform="rotate(28 38.5 33)"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#table)"/>
  <rect x="2" y="2" width="60" height="60" rx="12.5" fill="none" stroke="#f0b310" stroke-opacity=".5" stroke-width="1.6"/>
  <g transform="rotate(-14 30 34)">
    <rect x="11" y="13" width="27" height="38" rx="4" fill="#d2321e" stroke="#f5f1e8" stroke-width="2.2"/>
    <ellipse cx="24.5" cy="32" rx="7.4" ry="12" transform="rotate(28 24.5 32)" fill="#f5f1e8"/>
    <ellipse cx="24.5" cy="32" rx="3.4" ry="5.6" transform="rotate(28 24.5 32)" fill="#d2321e"/>
  </g>
  <g transform="rotate(12 36 34)">
    <rect x="25" y="14" width="27" height="38" rx="4" fill="#000" fill-opacity=".35" transform="translate(1.2 1.6)"/>
    <rect x="25" y="14" width="27" height="38" rx="4" fill="#14100e" stroke="#f5f1e8" stroke-width="2.2"/>
    <g clip-path="url(#oval)">
      <rect x="28" y="19" width="10.5" height="14" fill="#d2321e"/>
      <rect x="38.5" y="19" width="10.5" height="14" fill="#1565b8"/>
      <rect x="28" y="33" width="10.5" height="14" fill="#f0b310"/>
      <rect x="38.5" y="33" width="10.5" height="14" fill="#1e9e4a"/>
    </g>
  </g>
</svg>
