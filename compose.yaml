services:
  uno:
    build: .
    image: uno-multiplayer:local
    ports:
      - '5050:5050'
    environment:
      # Same origin serves the client, so no CORS allowlist is needed.
      CORS_ORIGIN: ''
      # Quoted, and 'false' rather than false: unquoted YAML true/false reaches
      # the container as 'true'/'false' anyway, but only by accident of the
      # serialiser. Set this to 'true' once a proxy puts HTTPS in front.
      BEHIND_TLS: 'false'
      GRACE_PERIOD_MS: '60000'
      MAX_ROOMS: '500'
      LOG_LEVEL: 'info'
      # Voice chat. Empty is right for localhost: peers on one machine pair on
      # host candidates and never reach a relay. It is also the only place voice
      # works over plain http - getUserMedia needs a secure context, and
      # localhost is the sole exemption, so a LAN address has no microphone.
      TURN_URL: '${TURN_URL:-}'
      TURN_SECRET: '${TURN_SECRET:-}'
      STUN_URL: '${STUN_URL:-}'
    restart: unless-stopped
    # State lives in memory: never scale this past one replica. Two replicas
    # would each hold half the rooms and neither would know about the other.
    deploy:
      replicas: 1
